name: Android prototype

on:
  push:
    branches: [feat/android-receiver, 'codex/**']
    paths: ['android/**', 'src/**', 'assets/icon.ico', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'assets/icon.ico', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: '9.2.1'
      - name: Prepare Rust and Android targets
        run: |
          command -v rustup || { echo '::error::rustup is missing from the runner'; exit 1; }
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager" || { echo '::error::Android SDK manager is missing'; exit 1; }
          rustup toolchain install 1.92.0 --profile minimal --component clippy
          rustup override set 1.92.0
          rustup target add armv7-linux-androideabi aarch64-linux-android
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.2.12479018'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Deployment guards and command help
        run: |
          python3 -m unittest discover -s android/tests -v
          python3 android/deploy.py --help
          bash android/build.sh --help
          bash android/install.sh --help
      - name: Native tests and lint
        run: |
          cargo test --manifest-path android/native/Cargo.toml --locked --lib -- --test-threads=2
          cargo clippy --manifest-path android/native/Cargo.toml --locked --all-targets
      - name: Build both ABIs, Java tests and Android lint
        run: bash android/build.sh --abi all
      - name: Fingerprint test APK
        working-directory: android/app/build/outputs/apk/debug
        run: |
          sha256sum app-debug.apk > SHA256SUMS
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app-debug.apk > SIGNER.txt
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: openchromecast-android-test-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/SHA256SUMS
            android/app/build/outputs/apk/debug/SIGNER.txt
          if-no-files-found: error
          retention-days: 14

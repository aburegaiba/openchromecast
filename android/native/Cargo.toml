[package]
name = "openchromecast-android"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[lib]
name = "openchromecast_android"
crate-type = ["cdylib", "rlib"]

[features]
default = ["embedded-player"]
embedded-player = []

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
jni = "0.21"
prost = "0.13"
rcgen = "0.13"
rsa = { version = "0.9", features = ["pem", "sha2", "getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
roxmltree = "0.21"
time = { version = "0.3", features = ["std"] }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
vibecast-apps-youtube = { git = "https://github.com/emilsvennesson/vibecast", rev = "4cde20b3f49b296debec8cb9a2badb51c7bae940" }
vibecast-sdk = { git = "https://github.com/emilsvennesson/vibecast", rev = "4cde20b3f49b296debec8cb9a2badb51c7bae940" }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
